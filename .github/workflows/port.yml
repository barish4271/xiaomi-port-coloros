name: Port ColorOS

on:
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: 'MIUI/澎湃底包直链'
        required: true
      coloros_url:
        description: 'ColorOS 移植包直链'
        required: true
      kernel_source_repo:
        description: '内核源码仓库地址（可选：root 关闭时仅用于分析，可留空走 boot.img 提取）'
        required: false
      kernel_branch:
        description: '内核分支'
        required: false
        default: 'lineage-20'
      defconfig_name:
        description: 'defconfig 名'
        required: false
      device_tree_repo:
        description: '设备树仓库地址（port.yml 中不使用，可留空）'
        required: false

jobs:
  port:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: 读取配置
        run: |
          python3 << 'PYEOF'
          import yaml, os
          with open('.github/workflows/port-config.yml') as f:
              cfg = yaml.safe_load(f)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              def walk(prefix, d):
                  for k, v in d.items():
                      key = f"{prefix}_{k}".upper() if prefix else k.upper()
                      if isinstance(v, dict):
                          walk(key, v)
                      else:
                          f.write(f"CFG_{key}={v}\n")
              walk("", cfg)
          PYEOF

      - name: 释放磁盘空间（ROM 镜像需要 40GB+）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /opt/az 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip unzip zip aria2 \
            android-sdk-libsparse-utils simg2img img2simg \
            brotli lz4 xz-utils u-boot-tools \
            p7zip-full e2fsprogs jq curl \
            liblz4-dev liblzma-dev zlib1g-dev uuid-dev \
            autoconf automake libtool pkg-config build-essential
          pip3 install protobuf pyyaml

      - name: 安装 payload-dumper-go
        run: |
          URL=$(curl -sL https://api.github.com/repos/ssut/payload-dumper-go/releases/latest \
            | jq -r '.assets[].browser_download_url | select(test("linux_amd64"))' | head -1)
          curl -sL "$URL" -o /tmp/pdg.tar.gz
          mkdir -p /tmp/pdg && tar -xzf /tmp/pdg.tar.gz -C /tmp/pdg
          sudo install /tmp/pdg/payload-dumper-go /usr/local/bin/
          payload-dumper-go --help 2>&1 | head -1

      - name: 构建最新 erofs-utils（apt 的 1.4 过旧，不支持新 EROFS 特性）
        run: |
          git clone --depth 1 --branch v1.9.4 https://github.com/erofs/erofs-utils.git /tmp/erofs-utils
          cd /tmp/erofs-utils
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          mkfs.erofs -V 2>&1 | head -1
          fsck.erofs -V 2>&1 | head -1

      - name: 下载固件
        run: bash scripts/download.sh "${{ inputs.base_rom_url }}" "${{ inputs.coloros_url }}"

      - name: 解包
        run: bash scripts/unpack.sh

      - name: 分析内核配置
        env:
          KERNEL_SOURCE_REPO: ${{ inputs.kernel_source_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        run: bash scripts/analyze-kernel.sh

      - name: 集成 Root
        if: env.CFG_ROOT_ENABLE == 'true'
        env:
          ENABLE_ROOT: ${{ env.CFG_ROOT_ENABLE }}
          ROOT_TYPE: ${{ env.CFG_ROOT_TYPE }}
          ROOT_VERSION: ${{ env.CFG_ROOT_VERSION }}
          KERNEL_SOURCE_REPO: ${{ inputs.kernel_source_repo }}
          KERNEL_BRANCH: ${{ inputs.kernel_branch }}
          DEFCONFIG_NAME: ${{ inputs.defconfig_name }}
        run: bash scripts/integrate-root.sh

      - name: 编译内核
        if: env.CFG_ROOT_ENABLE == 'true' && env.ROOT_INTEGRATED == 'true'
        env:
          ROOT_TYPE: ${{ env.CFG_ROOT_TYPE }}
          KERNEL_SOURCE_REPO: ${{ inputs.kernel_source_repo }}
          DEFCONFIG_NAME: ${{ inputs.defconfig_name }}
          DEVICE_MODEL: ${{ env.CFG_DEVICE_MODEL }}
          SYSTEM_NAME: ${{ env.CFG_DEVICE_SYSTEM_NAME }}
        run: bash scripts/build-kernel.sh

      - name: 合并分区
        run: bash scripts/merge-partitions.sh

      - name: 精简 APP
        env:
          DEBLOAT_AD: ${{ env.CFG_DEBLOAT_AD }}
          DEBLOAT_APP_MARKET: ${{ env.CFG_DEBLOAT_APP_MARKET }}
          DEBLOAT_GAME_CENTER: ${{ env.CFG_DEBLOAT_GAME_CENTER }}
          DEBLOAT_BROWSER: ${{ env.CFG_DEBLOAT_BROWSER }}
          DEBLOAT_CONTENT_EXT: ${{ env.CFG_DEBLOAT_CONTENT_EXT }}
          DEBLOAT_THEME_STORE: ${{ env.CFG_DEBLOAT_THEME_STORE }}
          DEBLOAT_VOICE_ASSISTANT: ${{ env.CFG_DEBLOAT_VOICE_ASSISTANT }}
          DEBLOAT_MUSIC: ${{ env.CFG_DEBLOAT_MUSIC }}
          DEBLOAT_VIDEO: ${{ env.CFG_DEBLOAT_VIDEO }}
          DEBLOAT_FEEDBACK: ${{ env.CFG_DEBLOAT_FEEDBACK }}
          DEBLOAT_OTA: ${{ env.CFG_DEBLOAT_OTA }}
        run: bash scripts/debloat.sh

      - name: 替换默认应用
        env:
          REPLACE_BROWSER: ${{ env.CFG_REPLACE_BROWSER_ENABLE }}
          REPLACE_BROWSER_URL: ${{ env.CFG_REPLACE_BROWSER_URL }}
          REPLACE_GALLERY: ${{ env.CFG_REPLACE_GALLERY_ENABLE }}
          REPLACE_GALLERY_URL: ${{ env.CFG_REPLACE_GALLERY_URL }}
          REPLACE_FILE_MANAGER: ${{ env.CFG_REPLACE_FILE_MANAGER_ENABLE }}
          REPLACE_FILE_MANAGER_URL: ${{ env.CFG_REPLACE_FILE_MANAGER_URL }}
        run: bash scripts/replace-apps.sh

      - name: 系统级修复
        env:
          FIX_OPENID: ${{ env.CFG_FIX_OPENID }}
          FIX_SELINUX: ${{ env.CFG_FIX_SELINUX }}
          FIX_AUDIO: ${{ env.CFG_FIX_AUDIO }}
          FIX_VIBRATOR: ${{ env.CFG_FIX_VIBRATOR }}
          FIX_HDR: ${{ env.CFG_FIX_HDR }}
          FIX_WECHAT_SCAN: ${{ env.CFG_FIX_WECHAT_SCAN }}
          FIX_WALLPAPER: ${{ env.CFG_FIX_WALLPAPER }}
          FIX_COLOR_TEMP: ${{ env.CFG_FIX_COLOR_TEMP }}
          FIX_NFC: ${{ env.CFG_FIX_NFC }}
          FIX_MODEM: ${{ env.CFG_FIX_MODEM }}
        run: bash scripts/system-fixes.sh

      - name: 应用机型补丁
        env:
          DEVICE_MODEL: ${{ env.CFG_DEVICE_MODEL }}
          PUNCH_HOLE_POSITION: ${{ env.CFG_DEVICE_PUNCH_HOLE_POSITION }}
          SOC_MODEL: ${{ env.CFG_DEVICE_SOC_MODEL }}
          SERIAL_NO: ${{ env.CFG_DEVICE_SERIAL_NO }}
          REPLACE_SELINUX: ${{ env.CFG_PATCH_REPLACE_SELINUX }}
          PATCH_FIRST_API_LEVEL: ${{ env.CFG_PATCH_FIRST_API_LEVEL }}
          PATCH_OPENID: ${{ env.CFG_PATCH_OPENID }}
        run: bash scripts/apply-patches.sh

      - name: 修复 fstab
        run: bash scripts/fix-fstab.sh

      - name: 打包
        env:
          PACK_MODE: ${{ env.CFG_PACK_MODE }}
          SUPER_SIZE: ${{ env.CFG_PACK_SUPER_SIZE }}
          DEVICE_MODEL: ${{ env.CFG_DEVICE_MODEL }}
          SYSTEM_NAME: ${{ env.CFG_DEVICE_SYSTEM_NAME }}
          ANDROID_VER: "16"
        run: bash scripts/pack.sh

      - name: 验证镜像
        id: verify1
        continue-on-error: true
        run: bash scripts/verify.sh

      - name: 分析日志并自动修复
        if: steps.verify1.outcome == 'failure'
        run: bash scripts/analyze-and-fix.sh

      - name: 重新打包
        if: steps.verify1.outcome == 'failure' && env.NEED_REPACK == 'true'
        env:
          PACK_MODE: ${{ env.CFG_PACK_MODE }}
          SUPER_SIZE: ${{ env.CFG_PACK_SUPER_SIZE }}
          DEVICE_MODEL: ${{ env.CFG_DEVICE_MODEL }}
          SYSTEM_NAME: ${{ env.CFG_DEVICE_SYSTEM_NAME }}
          ANDROID_VER: "16"
        run: bash scripts/pack.sh

      - name: 二次验证
        id: verify2
        if: steps.verify1.outcome == 'failure' && env.NEED_REPACK == 'true'
        continue-on-error: true
        run: bash scripts/verify.sh

      - name: 回滚
        if: steps.verify2.outcome == 'failure' && env.ROLLBACK_NEEDED == 'true'
        run: bash scripts/rollback-fix.sh

      - name: 上传到 123 网盘
        if: env.CFG_UPLOAD_PAN123 == 'true'
        env:
          PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
          PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
        run: bash scripts/upload-pan123.sh

      - name: 上传到 Release
        if: env.CFG_UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.CFG_DEVICE_MODEL }}-${{ env.CFG_DEVICE_SYSTEM_NAME }}-${{ github.run_number }}
          name: "${{ env.CFG_DEVICE_MODEL }} ${{ env.CFG_DEVICE_SYSTEM_NAME }} #${{ github.run_number }}"
          files: |
            work/output/*.zip
            work/output/*.img
            work/output/flash-fastbootd.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到 R2
        if: env.CFG_UPLOAD_R2 == 'true'
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/upload-r2.sh

      - name: 上传到 Alist
        if: env.CFG_UPLOAD_ALIST == 'true'
        env:
          ALIST_URL: ${{ secrets.ALIST_URL }}
          ALIST_TOKEN: ${{ secrets.ALIST_TOKEN }}
          ALIST_PATH: ${{ secrets.ALIST_PATH }}
        run: bash scripts/upload-alist.sh

      - name: 上传到 Artifact
        if: env.CFG_UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CFG_DEVICE_MODEL }}-${{ env.CFG_DEVICE_SYSTEM_NAME }}
          path: work/output/
          retention-days: 7